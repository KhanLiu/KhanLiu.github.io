<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f8f5">
    <meta name="description" content="A simple globe of places, journeys, and the moments in between.">
    <meta property="og:title" content="Life in Places">
    <meta property="og:description" content="A simple globe of places, journeys, and the moments in between.">
    <meta property="og:type" content="website">
    <title>Life in Places</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
    <link rel="stylesheet" href="{{ '/assets/css/travel-map.css' | relative_url }}?v=14">
</head>
<body>
    <header class="site-header site-header--life-map">
        <a class="site-header__name" href="{{ '/' | relative_url }}" aria-label="Zihan Liu home">Zihan Liu</a>
        <span class="site-header__separator" aria-hidden="true">|</span>
        <span class="site-header__title">Life Map</span>
        <span class="site-header__separator" aria-hidden="true">|</span>
        <a class="site-header__admin" href="{{ '/admin/' | relative_url }}">Edit</a>
    </header>
    <main>
        {%- include TravelMap.html -%}
    </main>

    <script id="travel-data" type="application/json">{{ site.data.trips | jsonify | replace: '</', '<\/' }}</script>
    <script id="flight-data" type="application/json">{{ site.data.flights | jsonify | replace: '</', '<\/' }}</script>
    <script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js" defer></script>
    <script src="{{ '/assets/js/travel-map.js' | relative_url }}?v=17" defer></script>
</body>
</html>
